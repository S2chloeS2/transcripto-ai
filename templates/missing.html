{% extends "base.html" %}
{% block title %}찾을 수 없음 — TranscriptoAI{% endblock %}
{% block body %}
<div class="page page-narrow">
  <div class="card card-pad">
    <div class="empty">
      {% if session_id %}
        {{ session_id }}번 기록을 찾을 수 없습니다. 삭제되었을 수 있습니다.
      {% else %}
        찾으시는 페이지가 없습니다.
      {% endif %}
      <div style="margin-top:16px;">
        <a class="btn btn-ghost btn-sm" href="{{ url_for('review') }}">지난 기록 보기</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
